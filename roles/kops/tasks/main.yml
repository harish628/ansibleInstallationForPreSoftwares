
---
- name: Download kOps binary
  get_url:
    url: https://github.com/kubernetes/kops/releases/latest/download/kops-linux-amd64
    dest: /usr/local/bin/kops
    mode: '0755'

- name: Verify kOps installation
  command: kops version
  register: kops_version
  changed_when: false

- name: Display kOps version
  debug:
    msg: "{{ kops_version.stdout }}"

