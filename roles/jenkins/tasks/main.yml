
---
- name: Install Java 21
  yum:
    name: java-21-amazon-corretto
    state: present

- name: Download Jenkins repository
  get_url:
    url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    mode: '0644'

- name: Import Jenkins GPG key
  rpm_key:
    state: present
    key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key

- name: Install Jenkins
  yum:
    name: jenkins
    state: present

- name: Enable Jenkins service
  systemd:
    name: jenkins
    enabled: yes

- name: Start Jenkins service
  systemd:
    name: jenkins
    state: started

- name: Retrieve Jenkins initial admin password
  command: cat /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_initial_password
  changed_when: false

- name: Display Jenkins initial admin password
  debug:
    msg: "Jenkins initial admin password is {{ jenkins_initial_password.stdout }}"

